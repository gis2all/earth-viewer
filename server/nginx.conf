# Nginx 示例：静态托管 dist/ + /sharing 反代到 ArcGIS（替代 Node 代理时使用）
server {
  listen 80;
  server_name earth-viewer.example.com;
  root /var/www/earth-viz-hub/dist;
  index index.html;

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ArcGIS 搜索 API 反向代理（绕开 CORS）
  location /sharing/ {
    proxy_pass https://www.arcgis.com;
    proxy_set_header Host www.arcgis.com;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Access-Control-Allow-Origin *;
  }
}
